<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Calculator v2</title>
  <style>
    :root {
      --main: #4f46e5;
      --bg: #eef2ff;
      --card: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f5f5);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--main);
    }
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: 0.2s;
    }
    input:focus {
      border-color: var(--main);
      outline: none;
      box-shadow: 0 0 5px rgba(79,70,229,0.3);
    }
    button {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--main);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #ddd;
      font-size: 15px;
    }
    .result div {
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .value {
      font-family: monospace;
    }
    .loading {
      text-align: center;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>計算エンジン v2</h2>
    <div class="input-box">
      <input id="B" type="number" placeholder="B" step="any">
      <input id="S2" type="number" placeholder="S2" step="any">
      <input id="S" type="number" placeholder="S" step="any">
      <input id="R" type="number" placeholder="R" step="any">
      <input id="r1" type="number" placeholder="r1" step="any">
      <input id="r2" type="number" placeholder="r2" step="any">
      <input id="g" type="number" placeholder="g" step="any">
    </div>
    
    <button onclick="calc()">計算する</button>
    
    <div class="result" id="resultBox">
      <div><span class="label">T1</span><span class="value" id="T1">-</span></div>
      <div><span class="label">T2</span><span class="value" id="T2">-</span></div>
      <hr>
      <div><span class="label">O1 = (B-S2)/T1</span><span class="value" id="O1">-</span></div>
      <div><span class="label">O2 = (B-S2)/T2</span><span class="value" id="O2">-</span></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzuvocWXPQN4zP07H30edoZfgx4MATBJJP4I9VkTzmidOnI4kUiMklg7uh27n8jMJyy/exec";

    async function calc() {
      const B = Number(document.getElementById("B").value);
      const S2 = Number(document.getElementById("S2").value);
      const S = Number(document.getElementById("S").value);
      const R = Number(document.getElementById("R").value);
      const r1 = Number(document.getElementById("r1").value);
      const r2 = Number(document.getElementById("r2").value);
      const g = Number(document.getElementById("g").value);
      
      const box = document.getElementById("resultBox");
      box.innerHTML = '<div class="loading">GASからT1,T2取得中...</div>';
      
      try {
        // 1. まずGASに7個の変数を送ってT1, T2をもらう
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ B, S2, S, R, r1, r2, g })
        });
        const data = await res.json();
        
        const T1 = Number(data.T1);
        const T2 = Number(data.T2);
        
        // T1, T2が0ならエラー
        if (!T1 || !T2 || T1 === 0 || T2 === 0) {
          box.innerHTML = '<div class="loading">エラー: GASからT1,T2が取得できませんでした</div>';
          console.log('GAS response:', data);
          return;
        }

        // 2. もらったT1, T2でO1, O2を計算
        const O1 = (B - S2) / T1;
        const O2 = (B - S2) / T2;
        
        box.innerHTML = `
          <div><span class="label">T1</span><span class="value">${T1.toFixed(6)}</span></div>
          <div><span class="label">T2</span><span class="value">${T2.toFixed(6)}</span></div>
          <hr>
          <div><span class="label">O1 = (B-S2)/T1</span><span class="value">${O1.toFixed(6)}</span></div>
          <div><span class="label">O2 = (B-S2)/T2</span><span class="value">${O2.toFixed(6)}</span></div>
        `;
        
      } catch (e) {
        box.innerHTML = '<div class="loading">エラー: GAS通信に失敗しました</div>';
        console.error(e);
      }
    }
  </script>
</body>
</html>
